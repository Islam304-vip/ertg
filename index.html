<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAVERSE ANIMATION MASTERPIECE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Fira+Code&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00ffcc;
            --purple: #bc13fe;
            --green: #2ecc71;
            --bg: #010808;
            --glass: rgba(0, 30, 30, 0.85);
        }

        body {
            margin: 0;
            background: var(--bg) url('фото пин.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* 🔹 2. FADE-IN ПОЯВЛЕНИЕ ВСЕГО САЙТА */
        .main-container {
            opacity: 0;
            animation: fadeIn 2s forwards;
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            height: 100vh;
            padding: 20px;
            gap: 20px;
            box-sizing: border-box;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        /* 🔹 7. СКРЫТОЕ МЕНЮ (CHECKBOX HACK) */
        #menu-check { display: none; }
        .side-menu {
            position: fixed;
            top: 0; left: -250px;
            width: 250px; height: 100%;
            background: var(--glass);
            border-right: 2px solid var(--neon);
            transition: transform 0.5s cubic-bezier(0.77, 0, 0.175, 1);
            z-index: 2000;
            padding: 20px;
        }
        #menu-check:checked ~ .side-menu { transform: translateX(250px); }
        .menu-btn {
            position: fixed; top: 20px; left: 20px;
            z-index: 2001; cursor: pointer;
            background: var(--neon); color: #000;
            padding: 10px; border-radius: 5px; font-weight: 900;
        }

        /* 🔹 8. КАРТОЧКА С HOVER-ЭФФЕКТОМ */
        .panel {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--neon);
            border-radius: 20px;
            padding: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .panel:hover {
            transform: translateY(-10px); /* Поднимается вверх */
            box-shadow: 0 15px 40px rgba(0, 255, 204, 0.4);
        }

        /* 🔹 1. ПЛАВНАЯ КНОПКА (TRANSITION) */
        .action-btn {
            background: transparent;
            border: 2px solid var(--neon);
            color: var(--neon);
            padding: 10px 20px;
            cursor: pointer;
            transition: background 0.3s, transform 0.3s, color 0.3s;
            font-family: 'Orbitron';
        }
        .action-btn:hover {
            background: var(--neon);
            color: black;
            transform: scale(1.1); /* Увеличивается */
        }

        /* 🔹 6. ПУЛЬСАЦИЯ КНОПКИ */
        .pulse-btn {
            animation: pulse-anim 2s infinite;
            margin-top: 20px;
        }
        @keyframes pulse-anim {
            0% { transform: scale(1); box-shadow: 0 0 0px var(--purple); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px var(--purple); }
            100% { transform: scale(1); box-shadow: 0 0 0px var(--purple); }
        }

        /* 🔹 3. ДВИЖЕНИЕ ПО ГОРИЗОНТАЛИ (Квадрат-сканер) */
        .scanner-square {
            width: 50px; height: 50px;
            background: var(--neon);
            position: relative;
            animation: moveHorizontal 4s infinite ease-in-out;
            margin: 20px 0;
            box-shadow: 0 0 15px var(--neon);
        }
        @keyframes moveHorizontal {
            0% { left: 0; }
            50% { left: calc(100% - 50px); }
            100% { left: 0; }
        }

        /* 🔹 4. ПРЫГАЮЩИЙ МЯЧ 🟠 (Ease-in-out пружина) */
        .bouncing-ball {
            width: 40px; height: 40px;
            background: var(--purple);
            border-radius: 50%;
            margin: 40px auto;
            animation: bounce 1.5s infinite ease-in-out alternate;
            box-shadow: 0 0 20px var(--purple);
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-100px); }
        }

        /* 🔹 5. ВРАЩАЮЩИЙСЯ ЛОАДЕР 🔄 */
        .loader {
            width: 50px; height: 50px;
            border: 5px solid rgba(255,255,255,0.1);
            border-top: 5px solid var(--neon); /* Border-top другого цвета */
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin: 20px auto;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* 🔹 9. АНИМАЦИЯ ТЕКСТА ✍️ (TYPING) */
        .typing-text {
            font-family: 'Fira Code';
            font-size: 14px;
            color: var(--neon);
            overflow: hidden;
            border-right: 2px solid var(--neon);
            white-space: nowrap;
            width: 0;
            animation: typing 3s steps(30, end) infinite;
        }
        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        /* 🔹 10. ПРЕЛОАДЕР (3 ПРЫГАЮЩИЕ ТОЧКИ) */
        .dots-loader {
            display: flex; gap: 10px; justify-content: center; margin-top: 20px;
        }
        .dot {
            width: 10px; height: 10px; background: var(--neon); border-radius: 50%;
            animation: dotJump 0.6s infinite alternate;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotJump { from { transform: translateY(0); } to { transform: translateY(-15px); } }

        /* ЦЕНТРАЛЬНОЕ ЯДРО (TRAVERSE CORE) */
        .core-system {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .sphere {
            width: 200px; height: 200px; border: 4px solid var(--neon); border-radius: 50%;
            position: relative; animation: spin 10s infinite linear;
            box-shadow: 0 0 50px var(--neon);
        }

        /* ДЕРЕВО */
        .tree-unit { text-align: center; }
        .trunk { width: 12px; height: 80px; background: #3e2723; margin: 40px auto 0; position: relative; }
        .leaves {
            width: 100px; height: 100px; background: var(--green); border-radius: 50%;
            position: absolute; top: -80px; left: -44px; box-shadow: 0 0 30px var(--green);
        }
    </style>
</head>
<body>

    <input type="checkbox" id="menu-check">
    <label for="menu-check" class="menu-btn">MENU</label>
    <div class="side-menu">
        <h3>SYSTEM SETTINGS</h3>
        <p>1. Overclocking</p>
        <p>2. Bio-Sync</p>
        <p>3. Reset Core</p>
    </div>

    <div class="main-container">
        
        <aside class="panel">
            <div class="unit-label">> BIO_ECOLOGY</div>
            <div class="tree-unit">
                <div class="trunk"><div class="leaves"></div></div>
            </div>
            
            <div class="typing-text">SYSTEM_BOOT_SUCCESS...</div>
            
            <button class="action-btn" style="margin-top: 30px;">ACTIVATE BIO</button>
            
            <div class="scanner-square"></div>
        </aside>

        <main class="core-system">
            <div class="sphere">
                <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-weight: 900;">CORE</div>
            </div>
            <h1 style="letter-spacing: 10px; margin-top: 50px; text-shadow: 0 0 20px var(--neon);">TRAVERSE</h1>
            
            <div class="dots-loader">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </main>

        <aside class="panel">
            <div class="unit-label">> MECHA_SYNC</div>
            
            <div class="loader"></div>

            <div class="bouncing-ball"></div>

            <button class="action-btn pulse-btn">EMERGENCY STOP</button>
            
            <p style="font-size: 10px; margin-top: 20px; color: var(--purple);">ENGINE STATUS: OVERHEAT</p>
        </aside>

    </div>

    <script>
        // Добавим немного интерактива для 3D
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.clientX) / 50;
            const y = (window.innerHeight / 2 - e.clientY) / 50;
            document.querySelector('.sphere').style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
        });
    </script>
</body>
</html>
